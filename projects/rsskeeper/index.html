<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Keeper - Jasper Pilgrim</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="rssreader-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <div class="nav-title">RSS Keeper</div>
                <div class="nav-description">Read and manage your RSS feeds</div>
            </div>
            <div class="nav-links">
                <a href="../../" class="nav-link">Home</a>
                <a href="../../projects.html" class="nav-link">Projects</a>
                <a href="../../contact.html" class="nav-link">Contact</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" class="sun-circle"></circle>
                    <line x1="12" y1="1" x2="12" y2="3" class="sun-ray"></line>
                    <line x1="12" y1="21" x2="12" y2="23" class="sun-ray"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" class="sun-ray"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" class="sun-ray"></line>
                    <line x1="1" y1="12" x2="3" y2="12" class="sun-ray"></line>
                    <line x1="21" y1="12" x2="23" y2="12" class="sun-ray"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" class="sun-ray"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" class="sun-ray"></line>
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" class="moon-path"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="app-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Feeds</h2>
                    <button class="add-feed-btn" id="addFeedBtn" title="Add Feed">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-actions">
                    <button class="action-btn" id="importBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Import
                    </button>
                    <button class="action-btn" id="exportBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Export
                    </button>
                </div>
                <div class="feeds-list" id="feedsList">
                    <!-- Feeds will be inserted here -->
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-panel">
                <div class="articles-header">
                    <h2 id="articlesTitle">Select a feed</h2>
                    <div class="header-actions">
                        <button class="refresh-btn" id="refreshBtn" style="display: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>
                <div class="articles-container" id="articlesContainer">
                    <div class="empty-state">
                        <div class="empty-icon">📰</div>
                        <div class="empty-title">No feed selected</div>
                        <div class="empty-message">Add a feed or select one from the sidebar to get started</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Feed Modal -->
        <div class="modal" id="addFeedModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add RSS Feed</h3>
                    <button class="close-modal" id="closeAddModal">×</button>
                </div>
                <div class="modal-body">
                    <form id="addFeedForm">
                        <div class="form-group">
                            <label for="feedUrl">Feed URL</label>
                            <input type="url" id="feedUrl" placeholder="https://example.com/feed.xml" required>
                        </div>
                        <div class="form-group">
                            <label for="feedName">Feed Name (optional)</label>
                            <input type="text" id="feedName" placeholder="Leave empty to use feed title">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-secondary" id="cancelAddBtn">Cancel</button>
                            <button type="submit" class="btn-primary">Add Feed</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Import Modal -->
        <div class="modal" id="importModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Import Feeds</h3>
                    <button class="close-modal" id="closeImportModal">×</button>
                </div>
                <div class="modal-body">
                    <p class="modal-description">Paste OPML content or upload an OPML file</p>
                    <textarea id="importTextarea" placeholder="Paste OPML content here..." rows="10"></textarea>
                    <input type="file" id="importFile" accept=".opml,.xml" style="display: none;">
                    <button type="button" class="btn-secondary" id="browseFileBtn">Browse File</button>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelImportBtn">Cancel</button>
                        <button type="button" class="btn-primary" id="importSubmitBtn">Import</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden file input for export -->
        <a id="exportLink" style="display: none;"></a>
    </main>

    <script src="../../assets/js/script.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
