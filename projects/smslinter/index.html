<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Linter - Jasper Pilgrim</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="smslinter-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1 class="nav-title">SMS Linter</h1>
                <p class="nav-description">Real-time 10DLC compliance checker</p>
            </div>
            <div class="nav-links">
                <a href="../../" class="nav-link">Home</a>
                <a href="../../projects.html" class="nav-link">Projects</a>
                <a href="../../contact.html" class="nav-link">Contact</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" class="sun-circle"></circle>
                    <line x1="12" y1="1" x2="12" y2="3" class="sun-ray"></line>
                    <line x1="12" y1="21" x2="12" y2="23" class="sun-ray"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" class="sun-ray"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" class="sun-ray"></line>
                    <line x1="1" y1="12" x2="3" y2="12" class="sun-ray"></line>
                    <line x1="21" y1="12" x2="23" y2="12" class="sun-ray"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" class="sun-ray"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" class="sun-ray"></line>
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" class="moon-path"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">

        <div class="app-container">
            <div class="left-panel">
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">ENCODING</div>
                        <button class="encoding-badge" id="encoding-badge">GSM-7</button>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">CHARACTERS</div>
                        <div class="char-display">
                            <span class="char-value" id="char-count">0</span>
                            <span class="char-max" id="char-max">/160</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">SEGMENTS</div>
                        <div class="stat-value-large" id="segment-count">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">WARNINGS</div>
                        <div class="stat-value-large" id="warning-count">0</div>
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-label-row">
                        <label for="sms-input">Message</label>
                    </div>
                    <div class="textarea-wrapper">
                        <textarea 
                            id="sms-input" 
                            class="sms-input" 
                            placeholder="Type or paste your SMS message here..."
                            rows="10"
                        ></textarea>
                        <div id="highlight-overlay" class="highlight-overlay"></div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="paste-btn">Paste</button>
                    <button class="action-btn" id="copy-btn">Copy</button>
                    <button class="action-btn" id="clear-btn">Clear</button>
                </div>
            </div>

            <div class="right-panel">
                <div class="tabs">
                    <button class="tab active" data-tab="warnings">
                        WARNINGS
                        <span class="tab-badge" id="warnings-badge">0</span>
                    </button>
                    <button class="tab" data-tab="segments">SEGMENTS</button>
                    <button class="tab" data-tab="preview">PREVIEW</button>
                </div>

                <div class="tab-content">
                    <div id="warnings-tab" class="tab-pane active">
                        <div id="warnings-container" class="warnings-container">
                            <div class="empty-state">
                                <div class="empty-icon">✓</div>
                                <div class="empty-title">No issues detected</div>
                                <div class="empty-message">Your message looks clean!</div>
                            </div>
                        </div>
                    </div>
                    <div id="segments-tab" class="tab-pane">
                        <div class="tab-placeholder">Segments view coming soon</div>
                    </div>
                    <div id="preview-tab" class="tab-pane preview-pane">
                        <div class="preview-controls">
                            <button class="preview-toggle active" data-mode="single">Single Message</button>
                            <button class="preview-toggle" data-mode="segments">Segments</button>
                        </div>
                        <div id="preview-container" class="preview-container">
                            <div class="phone-preview" id="single-preview">
                                <div class="phone-header">
                                    <div class="phone-notch"></div>
                                </div>
                                <div class="phone-content">
                                    <div class="phone-messages">
                                        <div class="message-bubble">
                                            <div class="message-text" id="preview-message"></div>
                                            <div class="message-time">Now</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="phone-preview segments-preview" id="segments-preview" style="display: none;">
                                <div class="phone-header">
                                    <div class="phone-notch"></div>
                                </div>
                                <div class="phone-content">
                                    <div class="phone-messages" id="segments-messages"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/script.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
