<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steinbeck - Jasper Pilgrim</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../" class="nav-logo">JP</a>
            <div class="nav-links">
                <a href="../../" class="nav-link">Home</a>
                <a href="../../projects.html" class="nav-link">Projects</a>
                <a href="../../resources.html" class="nav-link">Resources</a>
                <a href="../../contact.html" class="nav-link">Contact</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" class="sun-circle"></circle>
                    <line x1="12" y1="1" x2="12" y2="3" class="sun-ray"></line>
                    <line x1="12" y1="21" x2="12" y2="23" class="sun-ray"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" class="sun-ray"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" class="sun-ray"></line>
                    <line x1="1" y1="12" x2="3" y2="12" class="sun-ray"></line>
                    <line x1="21" y1="12" x2="23" y2="12" class="sun-ray"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" class="sun-ray"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" class="sun-ray"></line>
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" class="moon-path"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header class="app-header">
            <h1>Steinbeck</h1>
            <p>Markdown editor with live preview</p>
        </header>

        <div class="editor-container" id="editor-container">
            <div class="container-header">
                <div class="view-controls">
                    <button class="view-btn" id="editor-only-btn" title="Editor only">Editor</button>
                    <button class="view-btn active" id="split-view-btn" title="Split view">Split</button>
                    <button class="view-btn" id="preview-only-btn" title="Preview only">Preview</button>
                    <button class="view-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
                </div>
            </div>
            <div class="editor-panels-wrapper">
            <div class="editor-panel" id="editor-panel">
                <div class="panel-header">
                    <span class="panel-title">Editor</span>
                    <div class="panel-actions">
                        <button class="action-btn" id="clear-btn">Clear</button>
                        <button class="action-btn" id="copy-btn">Copy</button>
                    </div>
                </div>
                <div class="toolbar">
                    <button class="toolbar-btn" data-action="h1" title="Heading 1">H1</button>
                    <button class="toolbar-btn" data-action="h2" title="Heading 2">H2</button>
                    <button class="toolbar-btn" data-action="h3" title="Heading 3">H3</button>
                    <button class="toolbar-btn" data-action="bold" title="Bold">B</button>
                    <button class="toolbar-btn" data-action="italic" title="Italic">I</button>
                    <button class="toolbar-btn" data-action="code" title="Inline code">`</button>
                    <button class="toolbar-btn" data-action="link" title="Link">🔗</button>
                    <button class="toolbar-btn" data-action="list" title="List">•</button>
                    <button class="toolbar-btn" data-action="quote" title="Quote">"</button>
                </div>
                <textarea id="markdown-input" class="markdown-editor" placeholder="Start writing your markdown here..."></textarea>
            </div>

            <div class="preview-panel" id="preview-panel">
                <div class="panel-header">
                    <span class="panel-title">Preview</span>
                    <div class="panel-actions">
                        <button class="action-btn" id="share-btn" title="Share">Share</button>
                        <button class="action-btn" id="print-btn">Print</button>
                        <div class="export-dropdown">
                            <button class="action-btn" id="export-btn">Export ▼</button>
                            <div class="export-menu" id="export-menu">
                                <button class="export-option" data-format="md">Markdown</button>
                                <button class="export-option" data-format="html">HTML</button>
                                <button class="export-option" data-format="pdf">PDF</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="markdown-preview" class="markdown-preview"></div>
            </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Jasper Pilgrim | A Place for Things</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ruby.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
    <script src="../../script.js"></script>
    <script src="app.js"></script>
</body>
</html>
